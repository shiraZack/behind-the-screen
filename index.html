<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Behind the Screen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: one quiet column over a live point-field; one engraved card per layer carries the identity */
:root{--bg:#04051a;--surf:#0b0d2b;--hi:#1a1e4d;--lo:#01020e;--fg:#f1f2ff;--mut:#b3b8e2;--l7:#5b8cff;--l6:#a974ff;--l5:#5fe0c4;--act:#ff9d42;--c:var(--act);--no:#ffb3a1;
--body:Rubik,"Segoe UI",Arial,sans-serif;--disp:Unbounded,Rubik,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
nav{min-width:0}
main{grid-template-columns:minmax(0,1fr)}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 18px/1.65 var(--body);direction:rtl;min-height:100vh;overflow-x:hidden}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#portal{position:fixed;inset:0;z-index:50;background:#02030f;visibility:hidden;opacity:0;transition:opacity .45s,visibility .45s}
#portal.on{visibility:visible;opacity:1}
#portal canvas{width:100%;height:100%;display:block}
#portal .cap{position:absolute;inset-inline:16px;bottom:11%;text-align:center;font-weight:700;font-size:clamp(20px,3vw,32px);color:var(--c);text-shadow:0 0 24px var(--c)}
#portal button{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:max(24px,env(safe-area-inset-left,0px))}
header,main{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(4,5,26,.9);padding-block:12px;display:flex;gap:20px;align-items:center;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.brand{font:800 13px/1.1 var(--disp);direction:ltr;text-align:left}
nav ol{display:flex;gap:8px;list-style:none;margin:0;padding:4px;overflow-x:auto}
nav button{font:500 14px var(--body);color:var(--mut);background:none;border:0;border-radius:99px;padding:8px 14px;white-space:nowrap;cursor:pointer}
nav button[aria-current]{color:var(--fg);background:var(--surf);box-shadow:inset 3px 3px 7px var(--lo),inset -2px -2px 6px var(--hi)}
nav button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1080px;margin:auto;padding-block:56px 96px;display:grid;gap:56px}
h1,h2,h3,p{margin:0;text-wrap:pretty}
h1{font-size:clamp(34px,5.4vw,60px);line-height:1.12;font-weight:800;text-wrap:balance}
h1:focus{outline:0}
h2{font-size:26px;line-height:1.3}
h3{font-size:19px}
.lead{font-size:20px;color:var(--mut);max-width:58ch}
.tint{color:var(--c)}
.mut{color:var(--mut)}
:focus-visible{outline:3px solid var(--act);outline-offset:3px}
.panel{background:var(--surf);border-radius:28px;padding:clamp(22px,3.4vw,40px);box-shadow:12px 12px 30px var(--lo),-6px -6px 22px rgba(60,68,160,.2);display:grid;gap:24px;min-width:0}
.btn{font:700 18px var(--body);border:0;border-radius:18px;padding:16px 30px;background:var(--act);color:#231000;cursor:pointer;box-shadow:0 0 28px rgba(255,157,66,.3);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{background:#20234b;color:#a0a5d0;box-shadow:none;cursor:not-allowed}
.btn.soft{background:var(--surf);color:var(--fg);font-size:16px;padding:12px 22px;box-shadow:5px 5px 14px var(--lo),-3px -3px 10px var(--hi)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
/* home */
.home{min-height:74vh;place-content:center;justify-items:center;text-align:center;gap:28px}
.logo{direction:ltr;font-family:var(--disp);font-weight:800;line-height:1;margin:0}
.logo .a{display:block;font-size:clamp(21px,5vw,58px);margin-bottom:.15em}
.logo .b{display:block;font-size:clamp(42px,11.4vw,132px);letter-spacing:-.02em}
.grad{background:linear-gradient(100deg,var(--l7),var(--l6),var(--l5),var(--l7),var(--l6));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 9s linear infinite}
.mirror{display:block;font:800 clamp(42px,11.4vw,132px)/1 var(--disp);letter-spacing:-.02em;direction:ltr;transform:scaleY(-1);opacity:.42;filter:blur(2px);-webkit-mask:linear-gradient(to top,#000,transparent 62%);mask:linear-gradient(to top,#000,transparent 62%);margin-top:-.24em;margin-bottom:-.3em;pointer-events:none}
@keyframes flow{to{background-position:-300% 0}}
/* engraved card */
.hero{display:grid;grid-template-columns:1fr auto;gap:56px;align-items:center}
.hero>div:first-child{display:grid;gap:18px}
.card{width:230px;aspect-ratio:5/7;border-radius:26px;position:relative;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 26%,#0b0d2b),color-mix(in srgb,var(--c) 9%,#0b0d2b));box-shadow:14px 14px 34px var(--lo),-7px -7px 24px color-mix(in srgb,var(--c) 24%,transparent);display:grid;place-items:center;transition:transform .35s}
.card:hover{transform:perspective(700px) rotateY(-9deg) rotateX(4deg)}
.card::before{content:"";position:absolute;inset:13px;border-radius:17px;box-shadow:inset 4px 4px 9px rgba(0,0,20,.55),inset -3px -3px 8px color-mix(in srgb,var(--c) 30%,transparent)}
.card b{position:absolute;font:800 22px/1 var(--disp);color:var(--c);top:28px;right:28px}
.card b~b{inset:auto auto 28px 28px;transform:rotate(180deg)}
.card svg{width:56%;fill:none;stroke:color-mix(in srgb,var(--c) 42%,#03041a);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(1.6px 1.8px 0 color-mix(in srgb,var(--c) 75%,white)) drop-shadow(-1.5px -1.5px 1px rgba(0,0,15,.85))}
.face .card svg{width:auto;height:74%}
.card i{position:absolute;bottom:54px;font:700 17px var(--body)}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:36px}
/* roles */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.three .panel{padding:26px;gap:8px;align-content:start}
blockquote{margin:0;font-size:21px;line-height:1.5}
/* film */
.film{display:grid;gap:18px}
.film canvas{width:100%;aspect-ratio:16/8;border-radius:20px;background:#03041a;box-shadow:inset 6px 6px 18px var(--lo),inset -4px -4px 14px rgba(70,80,180,.22);display:block}
.film .capt{min-height:3.3em;font-size:20px;font-weight:500;text-align:center;max-width:50ch;margin:auto}
.bar{height:8px;border-radius:9px;background:var(--lo);overflow:hidden;flex:1;min-width:120px}
.bar span{display:block;height:100%;width:0;background:var(--c)}
/* practice */
.opts{display:grid;gap:14px}
.opt{font:400 17px/1.5 var(--body);text-align:right;color:var(--fg);background:var(--surf);border:2px solid transparent;border-radius:16px;padding:15px 20px;cursor:pointer;box-shadow:5px 5px 13px var(--lo),-3px -3px 10px var(--hi)}
.opt[aria-checked=true],.opt[aria-pressed=true]{border-color:var(--c);box-shadow:inset 4px 4px 10px var(--lo),inset -3px -3px 8px var(--hi)}
.opt:disabled{cursor:default;opacity:.75}
.fb{border-radius:16px;padding:16px 20px;background:#060720;border:2px solid}
.fb.ok{border-color:var(--l5)}.fb.no{border-color:var(--no)}
.fb strong{display:block}.ok strong{color:var(--l5)}.no strong{color:var(--no)}
.mrow{display:grid;grid-template-columns:1fr 210px;gap:12px 20px;align-items:center}
.mrow .fb{grid-column:1/-1}
select{font:500 17px var(--body);color:var(--fg);background:var(--surf);border:2px solid #343a7c;border-radius:14px;padding:12px;width:100%}
.sample{font-size:24px;line-height:1.9;background:#060720;border-radius:18px;padding:22px 26px;overflow-wrap:anywhere;font-weight:500}
.gate{justify-items:center;text-align:center}
.checks{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:center;list-style:none;margin:0;padding:0;color:var(--mut)}
.checks li::before{content:"○ "}.checks li.y{color:var(--l5)}.checks li.y::before{content:"✓ "}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:right;padding:16px 18px;vertical-align:top;border-bottom:1px solid #262b62}
thead th{font-size:20px}
/* ticket + stack */
.compose{max-width:640px;margin:auto;width:100%}
.compose canvas{width:100%;max-width:380px;border-radius:14px;display:block}
.stackwrap{display:grid;grid-template-columns:1fr 280px;gap:36px;align-items:center}
.stage{height:560px;perspective:1300px;display:grid;place-items:center;direction:ltr;min-width:0}
.stk{width:340px;height:226px;position:relative;transform-style:preserve-3d}
.slab{position:absolute;inset:0;transform-style:preserve-3d}
.slab u{position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--c) 45%,#03041a);text-decoration:none}
.slab .face{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 78%,#0b0d2b),color-mix(in srgb,var(--c) 42%,#0b0d2b));box-shadow:0 0 34px color-mix(in srgb,var(--c) 45%,transparent);display:grid;place-items:center}
.slab canvas{width:100%;height:100%}
.legend{display:grid;gap:22px;list-style:none;margin:0;padding:0}
.legend li{opacity:var(--o,.15)}
.legend b{color:var(--c);display:block;font-size:20px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--act);direction:rtl}
.bx{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-height:430px;align-content:start}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}
.duoa{display:grid;gap:8px;text-align:center;color:var(--mut);font-weight:500}
.box{border-radius:20px;padding:24px;display:grid;gap:8px;justify-items:center;text-align:center;background:var(--surf);box-shadow:inset 5px 5px 13px var(--lo),inset -3px -3px 10px var(--hi)}
.box b{color:var(--c);font-size:20px}.ic{width:64px;fill:none;stroke:var(--c);stroke-width:6;stroke-linejoin:round}
.tower{display:grid;gap:9px;max-width:460px}.tower .opt{padding:9px 18px}
#updown{width:100%;height:380px;display:block}
.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:0}.terms dt{font-weight:700;color:var(--c)}.terms dd{margin:0}
.btn.snd{font-size:14px;padding:8px 14px;white-space:nowrap;flex:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;background:#20245a;border-radius:14px;padding:12px 22px;max-width:92vw}
@media(max-width:800px){body{font-size:17px}.hero,.stackwrap,.three,.mrow,.terms,.duo{grid-template-columns:1fr}.hero .card{justify-self:center;grid-row:1;width:180px}main{gap:40px;padding-block:32px 72px}.stage{height:400px}.stk{scale:.74}.brand{font-size:10px}header{flex-wrap:wrap;gap:8px}nav{order:3;width:100%}.film canvas{aspect-ratio:4/3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="space" aria-hidden="true"></canvas>

<main id="app"></main>

<div class="toast" id="toast" role="status" hidden></div>

<script>

const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

function finish(k){if(!S.done[k]){S.done[k]=1;save();Snd.play('ok')}paintGate()}

6:'<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 92 50 50 92 8 50zM29 29l42 42M71 29 29 71M50 8v84M8 50h84"/></svg>',
5:'<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="17" cy="66" r="11"/><circle cx="83" cy="66" r="11"/><path d="M17 55C22 14 78 14 83 55M28 66h44M50 25v41"/></svg>'};

const L={
7:{trail:'המסע מתחיל כאן. צילום המסך צורף לפנייה, והיישום רוצה לשלוח אותו לשרת.',terms:[['יישום', 'תוכנה שמשתמשים בה, כמו דפדפן או תוכנת דואר.'], ['פרוטוקול', 'כללים מוסכמים לתקשורת.'], ['כתובת IP', 'מספר שמזהה יעד ברשת, למשל שרת.']],t:'שכבת היישום',en:'Application',lead:'הדלפק של הרשת: כאן יישומים מבקשים שירותי תקשורת ומקבלים תשובה.',
 roles:[['HTTP','בקשות ותשובות, למשל לפתיחת דף.'],['SMTP','שליחה והעברה של דואר אלקטרוני.'],['DNS','בירור כתובת לפי שם, כמו שם של אתר.']],
 note:'הדפדפן משתמש בשירותי השכבה, אבל הוא לא השכבה עצמה. הכפתורים והעיצוב הם ממשק.',
 tk:['אתרים אחרים נפתחים, אבל במערכת הארגונית מופיעה שגיאה.','מה כתוב בהודעת השגיאה, והאם היא מופיעה גם אצל עובדים נוספים?','נדע מה השירות מדווח, ואם הבעיה משותפת. עדיין אין הוכחה לתקלה בשכבה 7.'],

 gt:'איזה פרוטוקול מתאים?',q:{c:'שלושה תיאורים של עבודה בדפדפן.',q:'איזה תיאור מדגים שירות תקשורת של שכבת היישום?',a:0,o:[['הדפדפן משתמש ב־HTTP כדי לבקש דף מהשרת.','HTTP מגדיר תקשורת של בקשות ותגובות. זהו שירות תקשורת ליישום.'],['הדפדפן מציג כפתור כחול ולכן הוא שכבה 7.','צבע הכפתור שייך לממשק המשתמש. שכבת היישום עוסקת בשירותי תקשורת, ולא בכל מה שנראה במסך.'],['הטקסט מקודד ב־UTF-8 כדי לייצג אותיות.','UTF-8 מגדיר ייצוג של תווים. כאן חיפשנו את השירות שבאמצעותו מבקשים דף.']]}},

 note:'קידוד ודחיסה אינם הצפנה. קובץ קטן יותר אינו בהכרח מוגן.',
 tk:['הקובץ נפתח והמספרים בסדר, אבל השמות בעברית הפכו לסימנים.','באיזו תוכנה הקובץ נוצר, ובאיזו תוכנה פתחת אותו?','נברר אם התוכנות מפרשות את הקובץ אחרת. השיבוש לבדו אינו מוכיח תקלה בשכבה 6.'],

function nav(){$('#nav').innerHTML=PAGES.map((p,i)=>`<li><button data-p="${i}" ${i>S.max?'disabled':''} ${i===cur?'aria-current="page"':''}>${p[1]}${i>S.max?'<span aria-label="נעול"> 🔒</span>':''}</button></li>`).join('');$$('[data-p]').forEach(b=>b.onclick=()=>go(+b.dataset.p));const a=$('[aria-current]');if(a&&a.parentNode.parentNode.scrollWidth>a.parentNode.parentNode.clientWidth)a.scrollIntoView({inline:'center',block:'nearest'})}
function show(i,focus){loops.forEach(f=>f());loops=[];cur=i;const k=PAGES[i][0],n=+k.slice(5)||0,v=VIEW[k]();$('#app').style.setProperty('--c',COL[k.startsWith('layer')?n:0]);$('#app').innerHTML=v.html;nav();v.init&&v.init();const x=$('#next');if(x){x.onclick=()=>go(i+1);paintGate()}scrollTo(0,0);if(focus)$('h1').focus({preventScroll:true});if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k)}
function go(i){if(i>S.max)return;if(i===cur){return}const k=PAGES[i][0],n=k.startsWith('layer')?+k.slice(5):0;const CAP={7:'שכבה 7: עוטפים בבקשה',6:'שכבה 6: מפרקים לפיקסלים',5:'שכבה 5: פותחים שיחה'};if(n)portal(n,CAP[n],()=>show(i,true));else if(cur===0)portal(0,'מתחברים',()=>show(i,true));else show(i,true)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3500)}
function route(first){let i=PAGES.findIndex(p=>p[0]===location.hash.slice(1));if(i<0)i=0;if(i>S.max){i=S.max;toast('השלב הזה ייפתח אחרי השלמת השלבים שלפניו.')}if(first)show(i);else if(i!==cur)go(i);else history.replaceState(null,'','#'+PAGES[cur][0])}
addEventListener('hashchange',()=>route(false));route(true);
</script>
